<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Ícones -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- Mobile / PWA -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#03131f" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NexoElo" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black"
    />

    <!-- Site -->
    <title>NexoElo</title>

    <meta
      name="description"
      content="Tecnologia que conecta, automatiza e impulsiona seu negócio."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="NexoElo"
    />

    <meta
      property="og:description"
      content="Tecnologia que conecta, automatiza e impulsiona seu negócio."
    />

    <meta
      property="og:url"
      content="https://nexoelo.nexoceo.com.br/"
    />

    <meta
      property="og:site_name"
      content="NexoElo"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="NexoElo"
    />

    <meta
      name="twitter:description"
      content="Tecnologia que conecta, automatiza e impulsiona seu negócio."
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
