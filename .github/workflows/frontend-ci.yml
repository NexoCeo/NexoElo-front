name: Build frontend
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test -- src/pages/cliente-final/agendar/agendar.test.tsx src/services/cliente-final-auth-token.test.ts src/pages/others/servicos/servicos.test.tsx src/pages/others/servicos/service-image-crop.test.tsx src/pages/others/perfil/perfil.test.tsx src/pages/others/profissionais/profissionais.test.tsx
